<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>
<script>
function validarPassword() {
    var password = document.getElementById("password").value;
    var confirmarPassword = document.getElementById("confirmarPassword").value;

    // Verificar si la contraseña tiene al menos 8 caracteres
    if (password.length < 8) {
        alert("La contraseña debe tener al menos 8 caracteres");
        return false;
    }

    // Verificar si la contraseña contiene al menos una mayúscula, una minúscula, un número y un carácter especial
    var expresionRegular = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]+$/;
    if (!expresionRegular.test(password)) {
        alert("La contraseña debe contener al menos una mayúscula, una minúscula, un número y un carácter especial");
        return false;
    }

    // Verificar si las contraseñas coinciden
    if (password !== confirmarPassword) {
        alert("Las contraseñas no coinciden");
        return false;
    }

    return true;
}
</script>
</head>
<body>

<h2>Formulario de Registro</h2>

<form onsubmit="return validarPassword()">
  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" required><br><br>
  
  <label for="confirmarPassword">Confirmar Contraseña:</label>
  <input type="password" id="confirmarPassword" name="confirmarPassword" required><br><br>
  
  <input type="submit" value="Registrarse">
</form>

</body>
</html>
